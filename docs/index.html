<!DOCTYPE html>
<!--
   Healthy Living · 单文件高保真原型
   低饱和治愈系波点风格 · CSS/JS/SVG 全内联 · 零外部依赖 · 断网可用
   17 个屏幕：Splash / Login / Home / MapPage / Hospital / Doctor / AppointmentDone
            / Insurance(4 步) / Pharmacy / PharmacyDetail / OrderConfirm / OrderDone
            / Community / CommunityNew / Health / HealthWalk / HealthNutrition
   主题引擎：背景 + 强调色派生方块/卡片底色；文字随明暗自适配。
   主题：晨雾灰蓝 mist / 鼠尾草绿 sage / 陶土杏 clay / 薰衣草雾 haze / 干枯玫瑰 blush / 燕麦奶油 oat
   强调色：dust / moss / terra / mauve / rosewd / amber / teal / coral
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7FA0B4">
<title>Healthy Living · Healing Polka-dot Prototype</title>
<style>
:root{
  /* —— 默认主题变量（被 applyTheme 动态覆盖） —— */
  --coffee:#7C9179;          /* 主背景（鼠尾草绿默认） */
  --coffee-d:#6C8169;
  --coffee-l:#8FA48B;
  --cream:#F5EFE6;           /* 卡片底色 */
  --cream-d:#EAE1D3;
  --cream-soft:#FBF7F0;
  --theme-core:#83A088;
  --tile:#E2E5DC;            /* 内嵌方块底色 */
  --tile-2:#EEEEE5;
  --tile-3:#D4D9CD;
  --ink:#2F3A2E;             /* 卡片上的深色文字 */
  --ink-soft:#5E6A5C;
  --ink-mute:#8E9B8A;
  --on-bg:#F5EFE6;           /* 背景上的文字（深底→浅字，浅底→深字） */
  --on-bg-2:rgba(245,239,230,.72);
  --on-bg-3:rgba(245,239,230,.5);
  --on-bg-fill:rgba(245,239,230,.14);
  --on-bg-fill-s:rgba(245,239,230,.08);
  --on-grad:#F7F2EA;         /* 渐变大卡上的文字 */
  --on-grad-2:rgba(247,242,234,.78);
  --on-grad-3:rgba(247,242,234,.6);
  --on-grad-fill:rgba(247,242,234,.16);
  --tabbar-bg:rgba(49,37,31,.86);
  --tabbar-line:rgba(245,239,230,.08);
  --dot:rgba(245,239,230,.18);
  --dot-cream:rgba(59,46,40,.05);

  /* —— 强调色（被 applyTheme 动态覆盖） —— */
  --accent:#6EB8AE;
  --accent-d:#54A096;
  --accent-t:#DDEEEB;
  --rose:#C77B85;
  --rose-t:#F4E4E6;
  --sage:#8DA080;
  --sage-t:#E7ECE2;
  --gold:#D4A959;
  --gold-t:#F6EAD2;
  --sky:#7E9BB0;
  --sky-t:#E4ECF1;
  --terra:#B08968;
  --terra-t:#EFE2D3;

  --grad1:#A8BCA1;
  --grad2:#88A082;
  --line:rgba(59,46,40,.08);
  --shadow:0 6px 22px rgba(30,20,15,.14);
  --shadow-s:0 3px 12px rgba(30,20,15,.10);
  --shadow-card:0 4px 18px rgba(40,28,20,.10);
  --r:22px; --rs:15px; --rxs:11px;
  --dot-size:16px 16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#E5DDD0;
  color:var(--ink);line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 桌面：居中手机外壳 + 柔和背景；移动端：占满 */
.stage{
  width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 20% 20%, rgba(143,174,134,.22), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(110,184,174,.18), transparent 50%),
    linear-gradient(135deg,#E5DDD0 0%,#D8D0C2 100%);
  padding:24px;
}
.phone{
  position:relative;
  width:100%;max-width:430px;height:100%;max-height:920px;
  border-radius:44px;overflow:hidden;
  background:
    radial-gradient(var(--dot) 1.5px, transparent 2px) 0 0/var(--dot-size),
    linear-gradient(180deg,var(--coffee-d),var(--coffee) 22%,var(--coffee));
  box-shadow:0 30px 80px rgba(30,20,15,.30), 0 8px 24px rgba(30,20,15,.15);
  display:flex;flex-direction:column;
  isolation:isolate;
}
@media (max-width:480px){
  .stage{padding:0;}
  .phone{max-width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none;}
}

/* —— 状态栏 —— */
.statusbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 28px 6px;
  font-size:14px;font-weight:700;color:var(--on-bg);flex-shrink:0;
}
.statusbar .icons{display:flex;gap:6px;align-items:center;}
.statusbar svg{display:block;}

/* —— 屏幕滚动区 —— */
.screen{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-gutter:stable;
  overscroll-behavior:contain;
  position:relative;
}
.screen::-webkit-scrollbar{width:0;display:none;}

/* —— 页面通用动画 —— */
.page{animation:fadeUp .34s cubic-bezier(.22,.9,.3,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* —— 顶部条 —— */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:6px 20px 10px;flex-shrink:0;color:var(--on-bg);
}
.topbar .tb-txt{flex:1;min-width:0;}
.topbar h1{font-size:20px;font-weight:800;color:var(--on-bg);letter-spacing:.2px;}
.topbar .sub{font-size:12px;color:var(--on-bg-2);margin-top:2px;font-weight:500;}
.icon-btn{
  width:38px;height:38px;border-radius:13px;background:var(--on-bg-fill);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--on-bg);border:none;transition:.2s;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);}
.icon-btn svg{display:block;}
.spacer{height:8px;}

/* —— 主内容容器 —— */
.container{padding:6px 20px 110px;}
@media (max-width:380px){.container{padding:6px 16px 110px;}}

/* —— 卡片 —— */
.card{
  background:var(--cream);border-radius:var(--r);padding:18px;margin-bottom:12px;
  box-shadow:var(--shadow-card);position:relative;overflow:hidden;
  background-image:radial-gradient(var(--dot-cream) 1.3px, transparent 1.7px);
  background-size:15px 15px;background-position:0 0;
}
.card .card-row{display:flex;align-items:center;gap:12px;}
.card .title{font-size:16px;font-weight:800;color:var(--ink);}
.card .subtle{font-size:13px;color:var(--ink-soft);font-weight:500;}

/* —— 渐变大卡 —— */
.gradient-card{
  background:linear-gradient(135deg,var(--grad1),var(--grad2));
  border-radius:var(--r);padding:22px;margin-bottom:14px;
  color:var(--on-grad);box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.gradient-card::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(var(--on-grad-fill) 1.5px, transparent 2px) 0 0/12px 12px;
  pointer-events:none;
}
.gradient-card .gh{font-size:22px;font-weight:800;color:var(--on-grad);}
.gradient-card .gs{font-size:13px;color:var(--on-grad-2);margin-top:4px;font-weight:500;}
.gradient-card .gv{font-size:11px;color:var(--on-grad-3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}

/* —— 头像 —— */
.avatar{
  width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.5px;
}
.avatar.lg{width:64px;height:64px;border-radius:18px;font-size:22px;}
.avatar.xl{width:80px;height:80px;border-radius:22px;font-size:26px;}

/* —— 按钮 —— */
.btn{
  width:100%;padding:15px 18px;border-radius:15px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-size:15px;font-weight:800;letter-spacing:.5px;
  font-family:inherit;transition:.2s;
  box-shadow:0 4px 14px rgba(110,184,174,.35);
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
.btn.light{background:var(--cream);color:var(--ink);box-shadow:var(--shadow-s);}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--tile-3);box-shadow:none;}
.btn.ghost:active{background:var(--tile-2);}
.btn.tiny{padding:9px 14px;font-size:13px;border-radius:12px;width:auto;display:inline-flex;align-items:center;gap:6px;}
.mt{margin-top:14px;}

/* —— 两列网格 —— */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.tile{
  background:var(--cream);border-radius:var(--r);padding:18px;text-align:center;
  box-shadow:var(--shadow-card);cursor:pointer;transition:.2s;
  background-image:radial-gradient(var(--dot-cream) 1.3px, transparent 1.7px);
  background-size:15px 15px;
}
.tile:active{transform:scale(.97);}
.tile .big{font-size:34px;line-height:1;}
.tile .title{font-size:14px;font-weight:800;color:var(--ink);margin-top:8px;}

/* —— pill / 徽章 —— */
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 11px;border-radius:11px;font-size:11px;font-weight:700;
  background:var(--sage-t);color:var(--sage);letter-spacing:.3px;
}
.pill.light{background:var(--tile);color:var(--ink-soft);}
.pill.rose{background:var(--rose-t);color:var(--rose);}
.pill.amber{background:var(--amber-t,var(--gold-t));color:var(--gold);}
.pill.terra{background:var(--terra-t);color:var(--terra);}

/* —— 星星 —— */
.stars{color:var(--gold);font-size:13px;font-weight:700;}
.stars .subtle{color:var(--ink-mute);font-weight:500;font-size:11px;margin-left:3px;}

/* —— 输入框 —— */
.input{
  width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:13px;
  font-size:15px;background:var(--cream-soft);color:var(--ink);font-family:inherit;
  margin-bottom:10px;
}
.input:focus{outline:none;border-color:var(--accent);}

/* —— 时间槽位 —— */
.slots{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;}
.slot{
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;
  background:var(--tile);color:var(--ink);cursor:pointer;transition:.2s;
  border:2px solid transparent;
}
.slot:active{transform:scale(.94);}
.slot.sel{background:var(--accent-t);border-color:var(--accent);color:var(--accent-d);}

/* —— 列表行 —— */
.row{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--cream);border-radius:var(--rs);margin-bottom:10px;
  box-shadow:var(--shadow-card);cursor:pointer;transition:.2s;
  background-image:radial-gradient(var(--dot-cream) 1.3px, transparent 1.7px);
  background-size:15px 15px;
}
.row:active{transform:scale(.99);}
.row .grow{flex:1;min-width:0;}
.row .title{font-size:15px;font-weight:800;color:var(--ink);}
.row .subtle{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.row .price{font-size:15px;font-weight:800;color:var(--accent-d);}

/* —— Map 装饰区 —— */
.map{
  position:relative;height:170px;border-radius:var(--r);margin-bottom:14px;overflow:hidden;
  background:
    radial-gradient(circle at 20% 30%, var(--tile) 1px, transparent 2px) 0 0/12px 12px,
    radial-gradient(circle at 70% 60%, var(--tile-2) 1px, transparent 2px) 4px 4px/14px 14px,
    linear-gradient(135deg,var(--accent-t),var(--cream));
  box-shadow:var(--shadow-card);
}
.map::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:8px;background:var(--cream-soft);
  transform:translateY(-50%);box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.05);
}
.map::after{
  content:"";position:absolute;top:0;bottom:0;left:35%;width:6px;background:var(--cream-soft);
  box-shadow:inset 2px 0 0 rgba(255,255,255,.6), 0 0 4px rgba(0,0,0,.05);
}
.map-pin{
  position:absolute;width:34px;height:34px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.map-pin > span{transform:rotate(45deg);}

/* —— 底部 Tab —— */
.tabbar{
  position:absolute;left:16px;right:16px;bottom:calc(var(--safe-b) + 12px);
  display:flex;padding:8px 8px calc(var(--safe-b) + 0px);
  background:var(--tabbar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px;border:1px solid var(--tabbar-line);z-index:50;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;cursor:pointer;color:var(--on-bg-3);position:relative;transition:.2s;
}
.tab .ti{display:flex;align-items:center;justify-content:center;height:24px;transition:.2s;}
.tab .ti svg{width:22px;height:22px;transition:.2s;}
.tab .tl{font-size:10px;font-weight:700;letter-spacing:.3px;}
.tab.on{color:var(--accent);}
.tab.on .ti svg{transform:translateY(-2px) scale(1.06);stroke-width:2.3;}

/* —— 大按钮组（保险步骤 / 社区发帖） —— */
.tabs{display:flex;gap:8px;padding:5px;background:var(--tile);border-radius:14px;margin-bottom:14px;}
.tabs .tab-pill{
  flex:1;padding:9px 12px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);
  border-radius:10px;cursor:pointer;transition:.2s;
}
.tabs .tab-pill.on{background:var(--cream);color:var(--ink);box-shadow:var(--shadow-s);}

/* —— 圆形进度 —— */
.ring{
  width:160px;height:160px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,var(--cream) 55%,transparent 56%);
  position:relative;margin:10px auto;
}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.ring-track{stroke:var(--tile);}
.ring-progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s;}
.ring-inner{text-align:center;}
.ring-inner .num{font-size:32px;font-weight:800;color:var(--ink);line-height:1;}
.ring-inner .lab{font-size:12px;color:var(--ink-soft);margin-top:4px;}

/* —— 进度条 —— */
.progress-bar{
  height:8px;background:var(--tile);border-radius:6px;overflow:hidden;
}
.progress-bar > div{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-d));
  border-radius:6px;transition:width .5s;
}

/* —— 星点评分 —— */
.star-rate{font-size:30px;cursor:pointer;display:flex;justify-content:center;gap:6px;margin:14px 0;}
.star-rate span{color:var(--tile-3);transition:.2s;}
.star-rate span.on{color:var(--gold);}

/* —— Toast —— */
.toast-wrap{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;}
.toast{
  background:var(--cream);color:var(--ink);padding:11px 20px;border-radius:14px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow);
  margin-bottom:8px;opacity:1;animation:tin .3s ease;
  border:1px solid var(--line);
}
.toast.good{background:var(--sage-t);color:var(--sage);}
@keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

/* —— Sheet（底部弹层：主题设置） —— */
.sheet-mask{
  position:fixed;inset:0;background:rgba(25,16,12,.55);z-index:200;
  opacity:0;pointer-events:none;transition:.3s;
}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--cream-soft);
  border-radius:26px 26px 0 0;padding:8px 22px calc(var(--safe-b) + 24px);z-index:201;
  transform:translateY(105%);transition:transform .34s cubic-bezier(.22,.9,.3,1);
  max-height:88%;overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.sheet-bar{width:40px;height:4px;border-radius:4px;background:var(--tile-3);margin:8px auto 16px;}
.sheet h3{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px;}
.sheet .sub{font-size:12px;color:var(--ink-soft);margin-bottom:18px;}

/* —— 主题预览块 —— */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.theme-sw{
  aspect-ratio:1.4;border-radius:14px;cursor:pointer;border:3px solid transparent;
  position:relative;overflow:hidden;transition:.15s;
  background-size:14px 14px,100% 100%;
  box-shadow:var(--shadow-s);
}
.theme-sw .tsw-name{
  position:absolute;left:0;right:0;bottom:0;
  font-size:10px;font-weight:700;text-align:center;padding:5px 2px;
  background:rgba(0,0,0,.32);color:#fff;
}
.theme-sw.sel{border-color:var(--accent);transform:scale(1.04);}
.theme-sw.sel::after{
  content:"✓";position:absolute;top:5px;right:6px;width:18px;height:18px;
  background:var(--accent);color:#fff;border-radius:50%;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:800;
}
.accent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.accent-sw{
  aspect-ratio:1;border-radius:14px;cursor:pointer;border:3px solid transparent;
  transition:.15s;position:relative;
}
.accent-sw.sel{border-color:var(--ink);transform:scale(1.06);}
.accent-sw.sel::after{
  content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:14px;
}
.sec-title{
  display:flex;align-items:center;gap:8px;margin:18px 4px 10px;
}
.sec-title h3{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.5px;}
.sec-title .st-cap{font-size:11px;color:var(--ink-soft);font-weight:500;margin-left:6px;}

/* —— 成功页 —— */
.success-page{
  text-align:center;padding:60px 24px 24px;
}
.success-icon{
  width:90px;height:90px;border-radius:50%;background:var(--sage-t);color:var(--sage);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  font-size:42px;animation:pop .5s cubic-bezier(.22,.9,.3,1);
}
@keyframes pop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-page h2{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.success-page .subtle{color:var(--ink-soft);font-size:14px;line-height:1.6;}
.success-page .info-card{
  background:var(--cream);border-radius:var(--r);padding:18px;margin:24px 0;text-align:left;
  box-shadow:var(--shadow-card);
  background-image:radial-gradient(var(--dot-cream) 1.3px, transparent 1.7px);
  background-size:15px 15px;
}
.success-page .info-card .title{font-weight:800;color:var(--ink);font-size:14px;}

/* —— 字体 emoji 圆块（点缀用） —— */
.emoji-blob{
  width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:var(--tile);font-size:26px;
}

/* —— 简单的浮动按钮区 —— */
.fab{
  position:absolute;right:20px;bottom:calc(var(--safe-b) + 90px);
  width:54px;height:54px;border-radius:18px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;z-index:40;
}
.fab:active{transform:scale(.94);}

/* —— 隐藏 —— */
.hidden{display:none !important;}
.center{text-align:center;}

/* —— 沉浸式：让渐变大卡上的文字色更稳 —— */
.on-grad{color:var(--on-grad);}
.on-grad-2{color:var(--on-grad-2);}
.on-grad-3{color:var(--on-grad-3);}

/* —— Splash —— */
.splash{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:80px 24px;text-align:center;color:var(--on-bg);
}

/* —— map hero 装饰 —— */

function parseRGB(c){c=(c||'').trim();if(c[0]==='#'){const h=c.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}const m=c.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);return m?[+m[1],+m[2],+m[3]]:[245,239,230];}
function toHex2(n){return Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0');}
function mixHex(a,b,ratio){const A=parseRGB(a),B=parseRGB(b);return '#'+toHex2(A[0]+(B[0]-A[0])*ratio)+toHex2(A[1]+(B[1]-A[1])*ratio)+toHex2(A[2]+(B[2]-A[2])*ratio);}

function shadeHex(hex,ratio){const h=hex.replace('#','');let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);r=Math.round(r*(1-ratio));g=Math.round(g*(1-ratio));b=Math.round(b*(1-ratio));return `rgb(${r},${g},${b})`;}

  rs.setProperty('--accent-d',acD);
  rs.setProperty('--accent-t',tintHex(acC,.78));

  // 方块/卡片派生：背景 38% + 强调 62% → themeCore；再融合到 cream
  const themeCore=mixHex(bgHex,acC,.62);
  const surfaceRatio=isDark?.16:.18;
  const surfaceBase=mixHex(creamHex,themeCore,surfaceRatio);
  const surfaceSoft=mixHex('#ffffff',themeCore,.10);
  const surfaceD=mixHex(creamHex,themeCore,.28);
  const tileRatio=isDark?.36:.40;
  const tileBase=mixHex(surfaceBase,themeCore,tileRatio);
  const tile2=mixHex(surfaceBase,themeCore,.24);
  const tile3=mixHex(surfaceBase,themeCore,.52);
  rs.setProperty('--theme-core',themeCore);
  rs.setProperty('--cream',surfaceBase);
  rs.setProperty('--cream-d',surfaceD);
  rs.setProperty('--cream-soft',surfaceSoft);
  rs.setProperty('--tile',tileBase);
  rs.setProperty('--tile-2',tile2);
  rs.setProperty('--tile-3',tile3);
  // 浅主题下让卡片纹路更轻
  if(!isDark){
    rs.setProperty('--dot-cream','rgba(70,58,50,.04)');
  }else{
    rs.setProperty('--dot-cream','rgba(59,46,40,.05)');
  }
}

/* —— 工具 —— */
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pickColor(seed){return ACCENTS[Math.abs(hashCode(seed))%ACCENTS.length].c;}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++)h=(h<<5)-h+s.charCodeAt(i)|0;return h;}
function toast(msg,cls){
  const el=document.createElement('div');el.className='toast '+(cls||'');el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{el.style.transition='.4s';el.style.opacity='0';el.style.transform='translateY(-10px)';setTimeout(()=>el.remove(),400);},2400);
}
function openSheet(id){document.getElementById('mask').classList.add('show');document.getElementById(id).classList.add('show');}
function closeSheet(){document.getElementById('mask').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));}

  {id:'home',label:'Home',icon:'home'},
  {id:'map',label:'Map',icon:'pin'},
  {id:'pharmacy',label:'Pharmacy',icon:'pill'},
  {id:'community',label:'Community',icon:'chat'},
  {id:'health',label:'Health',icon:'leaf'},
];
const TAB_IDS=TABS.map(t=>t.id);
const stacks={home:[{name:'home'}],map:[{name:'map'}],pharmacy:[{name:'pharmacy'}],community:[{name:'community'}],health:[{name:'health'}]};
let activeTab='home';

function navTo(name,params,opts){
  params=params||{};
  const stack=stacks[activeTab];
  if(opts&&opts.reset){stacks[activeTab]=[{name,params:params||{}}];}
  else{stack.push({name,params});}
  render();
}
function back(){
  const stack=stacks[activeTab];
  if(stack.length>1){stack.pop();render();}
}
function switchTab(id){
  if(!TAB_IDS.includes(id))return;
  activeTab=id;
  render();
}

/* =========================================================
   渲染：调度 → 当前屏函数
   ========================================================= */
const screen=document.getElementById('screen');
const tabbar=document.getElementById('tabbar');

function renderTabbar(){
  const cur=stacks[activeTab][stacks[activeTab].length-1];
  const isTabRoute=TAB_IDS.includes(cur.name);
  if(!isTabRoute){tabbar.classList.add('hidden');return;}
  tabbar.classList.remove('hidden');
  tabbar.innerHTML=TABS.map(t=>{
    const on=(t.id===activeTab);
    return `<div class="tab${on?' on':''}" onclick="switchTab('${t.id}')">
      <div class="ti">${icn(t.icon,22,on?2.3:1.9)}</div>
      <div class="tl">${t.label}</div>
    </div>`;
  }).join('');
}

function render(){
  renderTabbar();
  const cur=stacks[activeTab][stacks[activeTab].length-1];
  const fn=RENDERERS[cur.name];
  if(!fn){screen.innerHTML='<div class="empty">Unknown screen</div>';return;}
  screen.innerHTML=`<div class="page">${fn(cur.params||{})}</div>`;
  screen.scrollTop=0;
  // home 右上齿轮
  if(cur.name==='home'){
    const g=document.createElement('div');
    g.className='gear-btn';g.innerHTML=icn('gear',20,2);g.title='Theme';
    g.onclick=openTheme;screen.appendChild(g);
  }
}

      </div>
      ${items.map(m=>`<div class="row">
        <div class="avatar" style="background:var(--accent-t);color:var(--accent-d)">💊</div>
        <div class="grow"><div class="title">${m.name}</div><div class="subtle">${m.tag}</div></div>
        <span class="price">¥${m.price.toFixed(2)}</span>
      </div>`).join('')}
      <div class="card" style="padding:14px;display:flex;justify-content:space-between;align-items:center">
        <div><div class="title">Total</div><div class="subtle">incl. delivery</div></div>
        <span style="font-size:18px;font-weight:800;color:var(--accent-d)">¥${total.toFixed(2)}</span>
      </div>
      <button class="btn mt" onclick="navTo('orderDone',{orderId:'${orderId}'})">Place Order</button>
    </div>`;
  },

  orderDone({orderId}){
    const oid=orderId||'01548875645';
    const r=state.rating[activeTab]||0;state.rating[activeTab]=r;
    const s=state.shared[activeTab]||false;state.shared[activeTab]=s;
    return `<div class="container">
      ${topbar({title:'',back:true})}
      <div class="success-page">
        <div class="success-icon" style="background:var(--accent-t);color:var(--accent-d)">🎉</div>
        <h2>Thank You!</h2>
        <div class="subtle">Order <b style="color:var(--ink)">#${oid}</b> placed successfully.<br>Arriving in ~30 minutes.</div>
        <div class="card mt" style="text-align:left">
          <div class="title">Share your experience</div>
          <div class="subtle mt" style="margin-top:4px;color:var(--ink-soft)">Your feedback helps pharmacies improve</div>
          <div class="star-rate">
            ${[1,2,3,4,5].map(i=>`<span class="${i<=r?'on':''}" onclick="state.rating['${activeTab}']=${i};render()">★</span>`).join('')}
          </div>
          <button class="btn light" onclick="state.shared['${activeTab}']=true;render()">${s?'✓ Shared':'Share experience'}</button>
        </div>
        <button class="btn mt" onclick="navTo('home',{},{reset:true});switchTab('home')">Back to Home</button>
      </div>
    </div>`;
  },

  /* —— Community —— */
  community(){
    return `<div class="container">
      ${topbar({title:'Community',sub:'Health stories & tips'})}
      <div class="tabs">
        <div class="tab-pill on">All</div>
        <div class="tab-pill">Following</div>
        <div class="tab-pill">Saved</div>
      </div>
      ${DATA.posts.map(p=>`<div class="post-card">
        <div class="post-meta">
          <div class="avatar" style="background:${p.color}">${p.avatar}</div>
          <div class="meta-txt"><div class="name">${p.author}</div><div class="time">${p.time} ago</div></div>
          <div style="margin-left:auto;color:var(--ink-mute)">${icn('more',18,2)}</div>
        </div>
        <div class="post-title">${p.title}</div>
        <div class="post-body">${p.body}</div>
        <div class="post-stats">
          <span>${icn('heart',12,2)} ${p.likes}</span>
          <span>${icn('chat',12,2)} ${p.comments}</span>
          <span>${icn('share',12,2)} ${p.shares}</span>
          <span style="margin-left:auto">${icn('bookmark',12,2)} Save</span>
        </div>
      </div>`).join('')}
      <div class="fab" onclick="navTo('communityNew')">${icn('pencil',22,2)}</div>
    </div>`;
  },

  communityNew(){
    const t=state.newPost[activeTab]?.title||'';
    const b=state.newPost[activeTab]?.body||'';
    const ready=t.trim()&&b.trim();
    return `<div class="container">
      ${topbar({title:'New Post',sub:'Share with community',back:true})}
      <div class="card">
        <input class="input" placeholder="Title" value="${esc(t)}" oninput="state.newPost['${activeTab}']={title:this.value,body:state.newPost['${activeTab}']?.body||''}" />
        <textarea class="input" rows="6" placeholder="Share your story…" style="resize:none" oninput="state.newPost['${activeTab}']={title:state.newPost['${activeTab}']?.title||'',body:this.value}">${esc(b)}</textarea>
        <div class="subtle" style="display:flex;justify-content:space-between;font-size:12px;margin-top:-4px;margin-bottom:10px">
          <span>Markdown supported</span>
          <span>${b.length}/500</span>
        </div>
        <button class="btn"${ready?'':' disabled'} onclick="state.newPost['${activeTab}']={title:'',body:''};toast('Post published','good');back()">Publish</button>
      </div>
      <div class="card">
        <div class="title" style="display:flex;align-items:center;gap:8px">${icn('palette',14,2)} Tips for a great post</div>
        <ul style="margin-top:10px;color:var(--ink-soft);font-size:13px;padding-left:18px;line-height:1.7">
          <li>Share personal experience, not generic advice</li>
          <li>Add a question to invite discussion</li>
          <li>Tag your post with #topic to reach more people</li>
        </ul>
      </div>
    </div>`;
  },

  /* —— Health —— */
  health(){
    const f=state.healthForm[activeTab]||state.healthForm;state.healthForm[activeTab]=f;
    const ready=f.age&&f.height&&f.weight;
    const set=k=>v=>{state.healthForm[activeTab]={...f,[k]:v};render();};
    return `<div class="container">
      ${topbar({title:'Exercise Tips',sub:'Personalize your plan'})}
      <div class="gradient-card" style="background:linear-gradient(135deg,var(--sage),var(--sage))">
        <div class="gv on-grad-2">YOUR PROFILE</div>
        <div class="gh on-grad" style="margin-top:4px">Tailor my plan</div>
        <div class="gs on-grad-2" style="margin-top:6px">A 30-second form gives you a personalized walking & nutrition plan</div>
      </div>
      <div class="card">
        <div class="title" style="margin-bottom:10px">About you</div>
        <div class="subtle" style="margin-bottom:6px;color:var(--ink-soft);font-size:12px;font-weight:700">GENDER</div>
        <div class="slots" style="margin-top:0">
          ${['Female','Male'].map(g=>`<div class="slot${f.gender===g?' sel':''}" onclick="(${set('gender')})('${g}')">${g}</div>`).join('')}
        </div>
        <div style="height:10px"></div>
        <input class="input" placeholder="Age" inputmode="numeric" value="${esc(f.age)}" oninput="(${set('age')})(this.value)" />
        <div class="input-grid">
          <input class="input" placeholder="Height (cm)" inputmode="numeric" value="${esc(f.height)}" oninput="(${set('height')})(this.value)" />
          <input class="input" placeholder="Weight (kg)" inputmode="numeric" value="${esc(f.weight)}" oninput="(${set('weight')})(this.value)" />
          <input class="input" placeholder="Goal" value="${esc(f.goal||'')}" oninput="(${set('goal')})(this.value)" />
        </div>
        <button class="btn mt"${ready?'':' disabled'} onclick="navTo('healthWalk')">Get my plan</button>
      </div>
    </div>`;
  },

  healthWalk(){
    return `<div class="container">
      ${topbar({title:'Walking',sub:'Daily brisk walk',back:true})}
      <div class="card center">
        <div style="font-size:48px;margin-bottom:8px">🚶</div>
        <div class="title" style="margin-top:6px">Brisk walking</div>
        <div style="font-size:46px;font-weight:800;color:var(--accent-d);margin:8px 0;line-height:1">30 <span style="font-size:18px">min</span></div>
        <div class="subtle">Great for heart health & mood</div>
      </div>
      <div class="card">
        <div class="card-row" style="justify-content:space-between;align-items:center">
          <div class="subtle" style="color:var(--ink-soft)">Today's goal</div>
          <div style="font-size:12px;font-weight:700;color:var(--accent-d)">18 / 30 min</div>
        </div>
        <div class="progress-bar mt" style="margin-top:8px"><div style="width:60%"></div></div>
        <div class="subtle mt" style="margin-top:12px;color:var(--ink-soft);font-size:12px">60% complete · 12 min remaining</div>
      </div>
      <div class="card">
        <div class="title" style="margin-bottom:10px">Why it works</div>
        <div class="subtle" style="color:var(--ink-soft);font-size:13px;line-height:1.7">30 min brisk walking daily lowers resting heart rate, improves VO₂ max, and stabilizes mood — all backed by long-term cohort studies.</div>
      </div>
      <button class="btn mt" onclick="navTo('healthNutrition')">Next: Nutrition</button>
    </div>`;
  },

  healthNutrition(){
    const meals=[
      {t:'Breakfast',time:'08:00',c:'Oats & fruits',e:'🥣',color:'var(--gold-t)'},
      {t:'Lunch',time:'12:00',c:'Grilled chicken salad',e:'🥗',color:'var(--sage-t)'},
      {t:'Dinner',time:'18:00',c:'Veggie bowl',e:'🍲',color:'var(--rose-t)'},
    ];
    return `<div class="container">
      ${topbar({title:'Nutrition',sub:'Daily plan',back:true})}
      <div class="card center">
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="9" class="ring-track"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke-width="9" class="ring-progress"
              stroke-dasharray="263.9" stroke-dashoffset="105.6"/>
          </svg>
          <div class="ring-inner">
            <div class="num">620</div>
            <div class="lab">Cal / day</div>
          </div>
        </div>
        <div class="title">Personal Nutrition Plan</div>
        <div class="subtle mt" style="margin-top:4px">Balanced macros for your profile</div>
      </div>
      <div class="stat-row">
        <div class="mini-stat"><div class="ico" style="color:var(--terra)">🥩</div><div><div class="lbl">Protein</div><div class="val">85 g</div></div></div>
        <div class="mini-stat"><div class="ico" style="color:var(--gold)">🌾</div><div><div class="lbl">Carbs</div><div class="val">120 g</div></div></div>
          <div class="mini-stat"><div class="ico" style="color:var(--sage)">🥑</div><div><div class="lbl">Fats</div><div class="val">42 g</div></div></div>
      </div>
      <div class="sec-title"><h3>Today's meals</h3></div>
      ${meals.map(m=>`<div class="meal-row">
        <div class="meal-emoji" style="background:${m.color}">${m.e}</div>
        <div style="flex:1"><div class="title">${m.t}</div><div class="subtle">${m.c}</div></div>
        <div class="time">${m.time}</div>
      </div>`).join('')}
      <button class="btn mt" onclick="navTo('home',{},{reset:true});switchTab('home')">Done</button>
    </div>`;
  },

};

/* =========================================================
   主题设置弹层
   ========================================================= */
function openTheme(){
  const sg=document.getElementById('themeSheet');
  sg.innerHTML=`
    <div class="sheet-bar"></div>
    <h3>主题外观</h3>
    <div class="sub">背景色 × 强调色 × 波点纹理，让界面随你的心情换肤</div>

    <div class="sec-title"><h3>背景</h3><span class="st-cap">${SETTINGS.dots?'波点 ON':'纯色'}</span></div>
    <div class="theme-grid">
      ${THEMES.map(t=>{
        const dotStyle=SETTINGS.dots?'radial-gradient(circle, rgba(255,255,255,.22) 1px, transparent 2px) 0 0/12px 12px,':'';
        return `<div class="theme-sw${SETTINGS.bg===t.id?' sel':''}" style="background:${dotStyle}linear-gradient(135deg,${t.grad1},${t.grad2})" onclick="pickBg('${t.id}')">
          <div class="tsw-name">${t.name}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn tiny" style="background:var(--tile);color:var(--ink);box-shadow:none;flex:1" onclick="toggleDots()">${SETTINGS.dots?'关闭波点':'开启波点'}</button>
    </div>

    <div class="sec-title"><h3>强调色</h3><span class="st-cap">按钮 & 链接</span></div>
    <div class="accent-grid">
      ${ACCENTS.map(a=>`<div class="accent-sw${SETTINGS.accent===a.id?' sel':''}" style="background:${a.c}" onclick="pickAccent('${a.id}')"></div>`).join('')}
    </div>

    <button class="btn light mt" onclick="closeSheet()" style="margin-top:18px">完成</button>
  `;
  openSheet('themeSheet');
}
function pickBg(id){SETTINGS.bg=id;applyTheme();saveSettings();openTheme();}
function toggleDots(){SETTINGS.dots=!SETTINGS.dots;applyTheme();saveSettings();openTheme();}
function pickAccent(id){SETTINGS.accent=id;applyTheme();saveSettings();openTheme();}
function saveSettings(){try{localStorage.setItem('hl_theme',JSON.stringify(SETTINGS));}catch(e){}}

/* =========================================================
   初始化：splash → 1.4s → login → home
   ========================================================= */
applyTheme();
stacks.home=[{name:'home'}];
stacks.map=[{name:'map'}];
stacks.pharmacy=[{name:'pharmacy'}];
stacks.community=[{name:'community'}];
stacks.health=[{name:'health'}];
activeTab='home';
stacks.home=[{name:'splash'}];
render();

setTimeout(()=>{
  stacks.home=[{name:'login'}];
  activeTab='home';
  render();
},1500);

/* —— 实时时钟（状态栏） —— */
(function clock(){
  const el=document.getElementById('clock');
  function tick(){
    const d=new Date();
    el.textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  tick();setInterval(tick,30000);
})();

/* —— 暴露到 window —— */
window.navTo=navTo;window.back=back;window.switchTab=switchTab;
window.state=state;window.render=render;
window.openTheme=openTheme;window.pickBg=pickBg;window.toggleDots=toggleDots;window.pickAccent=pickAccent;
window.closeSheet=closeSheet;window.toast=toast;
</script>
</body>
</html>
